<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Operation — Employee App</title>
<!--
  Digital Operation — prototype host. Keeps both apps loaded (employee-app.html and pm-app.html)
  and shows one at a time. The switcher itself sits above each phone (switcher.js) and asks this
  page to swap apps, so each app keeps its own state. Deep links: index.html#employee, index.html#pm.
-->
<style>
  html,body{margin:0;height:100%;background:#F6F6F8}
  body{overflow:hidden}
  iframe{display:block;width:100%;height:100%;border:0;background:#F6F6F8}
  iframe[hidden]{display:none}
</style>
</head>
<body>
<iframe id="app-employee" title="تطبيق الموظف" src="employee-app.html" hidden></iframe>
<iframe id="app-pm" title="تطبيق مدير المشروع" src="pm-app.html" hidden></iframe>
<script>
  const FRAMES = { employee: document.getElementById('app-employee'), pm: document.getElementById('app-pm') };
  function show(app, focus) {
    if (!(app in FRAMES)) app = 'employee';
    Object.entries(FRAMES).forEach(([k, f]) => { f.hidden = k !== app; });
    if (location.hash !== '#' + app) history.replaceState(null, '', '#' + app);
    document.title = `Digital Operation — ${app === 'pm' ? 'Project Manager App' : 'Employee App'}`;
    if (focus) { FRAMES[app].focus(); FRAMES[app].contentWindow.postMessage({ type: 'do:focus-switch' }, '*'); }
  }
  // Only the two hosted apps may ask to switch.
  addEventListener('message', e => {
    const fromApp = Object.values(FRAMES).some(f => f.contentWindow === e.source);
    if (fromApp && e.data && e.data.type === 'do:switch-app') show(e.data.app, true);
  });
  addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
</script>
</body>
</html>
