/* ═════════════════════ Actions ═════════════════════ */
function setMsg(el, kind, icon, text) {
  if (!kind) { el.hidden = true; return; }
  el.className = 'msg msg-' + kind;
  el.innerHTML = `${ICON(icon)}<span>${text}</span>`;
  el.hidden = false;
}
const ERR = 'solar:danger-circle-bold';
function previewHTML(a) {
  const t = FT[a.t];
  let body, cap = '';
  if (a.t === 'img') body = a.url ? `<img src="${a.url}" alt="${esc(a.name)}">` : `<span class="thumb pv-art t${tone(a.id)}" data-seed="${+a.id.slice(1)}"></span>`, cap = a.url ? '' : 'صورة تجريبية';
  else if (a.t === 'video') body = a.poster ? `<span class="thumb pv-art has-img" style="background-image:url('${a.poster}')"><span class="play">${ICON('solar:play-bold')}</span></span>`
    : `<span class="thumb pv-art t${tone(a.id)}" data-seed="${+a.id.slice(1)}"><span class="play">${ICON('solar:play-bold')}</span></span>`, cap = 'فيديو تجريبي — لا يوجد ملف فعلي للتشغيل';
  else body = `<div class="pdf-page" aria-hidden="true"><i class="h"></i>${'<i></i>'.repeat(4)}<i style="width:70%"></i><br>${'<i></i>'.repeat(5)}<i style="width:45%"></i></div>`, cap = 'مستند تجريبي';
  return `<div class="pv" role="dialog" aria-label="معاينة ${esc(a.name)}">
    <div class="pv-top"><button class="icon-btn" type="button" data-act="closeOverlay" aria-label="إغلاق">${ICON('solar:close-circle-linear')}</button>
      <div class="pv-name"><strong>${esc(a.name)}</strong><span><span class="latin" dir="ltr">${a.size}</span> · ${t.label}</span></div>
      <button class="icon-btn" type="button" data-act="download" data-a="${a.id}" aria-label="تنزيل">${ICON('solar:download-minimalistic-bold')}</button></div>
    <div class="pv-body">${body}</div>${cap ? `<div class="pv-cap">${cap}</div>` : ''}</div>`;
}
const ACTIONS = {
  back,
  closeOverlay,
  fillDemo() { fillDemoLogin(); },
  splashNext() { leaveSplash(); },
  obNext() { obTo(+(cur().params.i || 0) + 1); },
  obPrev() { obTo(+(cur().params.i || 0) - 1); },
  obGo(el) { obTo(+el.dataset.i); },
  obSkip() { finishIntro(); },
  eye(el) {
    const input = el.parentElement.querySelector('input'), show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    el.setAttribute('aria-label', show ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور');
    el.firstElementChild.setAttribute('icon', show ? 'solar:eye-closed-bold' : 'solar:eye-bold');
  },
  homeFilter(el) { chipX = el.parentElement.scrollLeft; S.homeFilter = el.dataset.f; render('stay'); },
  updFilter(el) { cur().params.who = el.dataset.f; cur().params.limit = 0; render('stay'); },
  fileFilter(el) { cur().params.f = el.dataset.f; cur().params.limit = 0; render('stay'); },
  actFilter(el) { cur().params.f = el.dataset.f; cur().params.limit = 0; render('stay'); },
  more() { const p = cur().params; p.limit = (p.limit || { files: 12, activity: 20 }[cur().name] || 6) * 2; render('stay'); },
  preview(el) {
    $('#overlay').innerHTML = previewHTML(S.atts[el.dataset.a]);
    $('#statusbar').classList.add('light');
    decorate($('#overlay'));
  },
  download(el) {
    const a = S.atts[el.dataset.a];
    if (a.url) { const l = document.createElement('a'); l.href = a.url; l.download = a.name; l.click(); toast(`تم تنزيل ${a.name}`, 'solar:download-minimalistic-bold'); }
    else toast(`تنزيل ${a.name} (ملف تجريبي)`, 'solar:download-minimalistic-bold');
  },
  mapPin(el) { S.mapSel = el.dataset.p; render('stay'); },
  mapFilter(el) {
    const s = el.dataset.s;
    S.mapHide = S.mapHide.includes(s) ? S.mapHide.filter(x => x !== s) : [...S.mapHide, s];
    render('stay');
  },
  mapAll() { S.mapHide = []; render('stay'); },
  calDay(el) { S.cal.d = +el.dataset.d; render('stay'); },
  calPrev() { let { y, m } = S.cal; m--; if (m < 1) { m = 12; y--; } S.cal = { y, m, d: 1 }; render('stay'); },
  calNext() {
    let { y, m } = S.cal; m++; if (m > 12) { m = 1; y++; }
    S.cal = { y, m, d: (y === 2026 && m === 11) ? 2 : 1 }; render('stay');
  },
  calToday() { S.cal = { y: 2026, m: 11, d: 2 }; render('stay'); },
  repPeriod(el) { S.rep.period = el.dataset.f; render('stay'); },
  repProject(el) { S.rep.p = el.dataset.f; render('stay'); },
  openReport(el) { S.rep.p = el.dataset.p; tab('reports'); },
  openNote(el) {
    const n = S.notes.find(x => x.id === el.dataset.n);
    n.unread = false;
    if (!(n.p && visibleCodes().includes(n.p))) { render('stay'); return toast('لم يعد لديك صلاحية الوصول إلى هذا المشروع', 'solar:lock-keyhole-minimalistic-bold'); }
    const u = n.u && U(n.u);
    if (u && shown(u)) go('update', { u: u.id }); else go('project', { p: n.p });
  },
  markAll() { S.notes.forEach(n => n.unread = false); render('stay'); toast('تم تحديد كل الإشعارات كمقروءة'); },
  // BRD: only the PM app asks for logout confirmation.
  logout() {
    openSheet(`<h3 class="h-md">تسجيل الخروج؟</h3><div class="sec-sub">ستحتاج إلى إدخال بريدك وكلمة المرور لتسجيل الدخول مجددًا.</div>
      <div class="btn-row" style="margin-top:20px"><button class="btn-sec" type="button" data-act="closeOverlay">إلغاء</button><button class="btn-danger" type="button" data-act="logoutConfirm">تسجيل الخروج</button></div>`);
  },
  logoutConfirm() { S.authed = false; S.stack = [{ name: 'login', params: {} }]; render('fade'); toast('تم تسجيل الخروج', 'solar:logout-2-bold'); },
};

const SUBMITS = {
  login() {
    const email = $('#lgEmail').value.trim().toLowerCase(), pass = $('#lgPass').value, msg = $('#lgMsg');
    $('#lgPassBox').classList.remove('bad');
    if (!email || !pass) return setMsg(msg, 'error', ERR, 'يرجى إدخال البريد الإلكتروني وكلمة المرور.');
    if (!/^\S+@\S+\.\S+$/.test(email)) return setMsg(msg, 'error', ERR, 'صيغة البريد الإلكتروني غير صحيحة.');
    // BRD: deactivated users cannot log in; their data is kept.
    if (DEACTIVATED.includes(email)) return setMsg(msg, 'warn', 'solar:forbidden-circle-bold', 'هذا الحساب معطّل حاليًا. تواصل مع مسؤول النظام لإعادة تفعيله.');
    if (email !== S.email || pass !== S.password) { $('#lgPassBox').classList.add('bad'); return setMsg(msg, 'error', ERR, 'البريد الإلكتروني أو كلمة المرور غير صحيحة.'); }
    setMsg(msg);
    const btn = $('#lgBtn'); btn.classList.add('loading'); btn.disabled = true;
    setTimeout(() => { S.authed = true; tab('home'); toast(`مرحبًا بك، ${USERS.me.first}`); }, 700);
  },
  password() {
    const [a, b, c] = ['pw0', 'pw1', 'pw2'].map(id => $('#' + id).value), msg = $('#pwMsg');
    ['pw0Box', 'pw1Box', 'pw2Box'].forEach(id => $('#' + id).classList.remove('bad'));
    if (!a || !b || !c) return setMsg(msg, 'error', ERR, 'يرجى تعبئة جميع الحقول.');
    if (a !== S.password) { $('#pw0Box').classList.add('bad'); return setMsg(msg, 'error', ERR, 'كلمة المرور الحالية غير صحيحة.'); }
    if (b !== c) { $('#pw2Box').classList.add('bad'); return setMsg(msg, 'error', ERR, 'كلمة المرور الجديدة وتأكيدها غير متطابقين.'); }
    S.password = b;
    back(); toast('تم تغيير كلمة المرور');
  },
  email() {
    const v = $('#em1').value.trim().toLowerCase(), msg = $('#emMsg'), box = $('#em1Box');
    box.classList.remove('bad');
    if (!v) return setMsg(msg, 'error', ERR, 'يرجى إدخال البريد الإلكتروني الجديد.');
    if (!/^\S+@\S+\.\S+$/.test(v)) { box.classList.add('bad'); return setMsg(msg, 'error', ERR, 'صيغة البريد الإلكتروني غير صحيحة.'); }
    if (v === S.email) { box.classList.add('bad'); return setMsg(msg, 'error', ERR, 'هذا هو بريدك الحالي.'); }
    // BRD: email change only requires uniqueness (no OTP).
    const taken = [...Object.values(USERS).map(u => u.email), ...DEACTIVATED].filter(e => e !== S.email);
    if (taken.includes(v)) { box.classList.add('bad'); return setMsg(msg, 'error', ERR, 'هذا البريد مستخدم في حساب آخر. اختر بريدًا مختلفًا.'); }
    S.email = v;
    back(); toast('تم تحديث البريد الإلكتروني');
  },
};

/* ═════════════════════ Wiring ═════════════════════ */
phone.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-go],[data-tab]');
  if (!t || !phone.contains(t) || t.disabled) return;
  if (t.dataset.act) { e.preventDefault(); return ACTIONS[t.dataset.act](t, e); }
  if (t.dataset.tab) return tab(t.dataset.tab);
  if (t.dataset.go) { const { go: name, ...params } = t.dataset; go(name, params); }
});
phone.addEventListener('submit', e => { e.preventDefault(); SUBMITS[e.target.dataset.submit](e.target); });
phone.addEventListener('input', e => {
  if (['lgEmail', 'lgPass'].includes(e.target.id)) { $('#lgMsg').hidden = true; $('#lgPassBox').classList.remove('bad'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#overlay').innerHTML) closeOverlay(); });

/* Side panel */
const FLOW = [['splash', '01', 'شاشة البداية'], ['onboarding', '02', 'التعريف بالتطبيق'], ['login', '03', 'تسجيل الدخول'], ['home', '04', 'الرئيسية'], ['project', '05', 'تفاصيل المشروع'],
  ['updates', '06', 'التحديثات اليومية'], ['update', '07', 'تفاصيل التحديث'], ['files', '08', 'مكتبة الملفات'], ['activity', '09', 'سجل النشاط'], ['map', '10', 'الخريطة'],
  ['reports', '11', 'التقارير'], ['calendar', '12', 'التقويم'], ['notifications', '13', 'الإشعارات'], ['profile', '14', 'حسابي'], ['password', '15', 'تغيير كلمة المرور'], ['email', '16', 'تغيير البريد الإلكتروني']];
$('#flow').innerHTML = FLOW.map(([k, n, l]) => `<button type="button" data-jump="${k}"><span class="n">${n}</span>${l}</button>`).join('');
function syncSide() {
  const name = cur().name;
  document.querySelectorAll('[data-jump]').forEach(b => b.setAttribute('aria-current', b.dataset.jump === name));
  $('#noProjects').checked = S.noProjects;
}
function jump(name) {
  if (['splash', 'onboarding', 'login'].includes(name)) { S.authed = false; S.stack = [{ name, params: name === 'onboarding' ? { i: 0 } : {} }]; return render('fade'); }
  if (['project', 'updates', 'update', 'files', 'activity'].includes(name)) S.noProjects = false;
  S.authed = true;
  const p = { p: 'PRJ-0142' }, u = { u: updatesOf('PRJ-0142')[0].id };
  const paths = {
    home: [['home']], project: [['home'], ['project', p]], updates: [['home'], ['project', p], ['updates', p]], update: [['home'], ['project', p], ['updates', p], ['update', u]],
    files: [['home'], ['project', p], ['files', p]], activity: [['home'], ['project', p], ['activity', p]], map: [['map']], reports: [['reports']], calendar: [['calendar']],
    notifications: [['home'], ['notifications']], profile: [['profile']], password: [['profile'], ['password']], email: [['profile'], ['email']],
  };
  S.stack = paths[name].map(([n, params]) => ({ name: n, params: { ...(params || {}) } }));
  render('fade');
}
$('#flowToggle').addEventListener('click', e => {
  const open = e.currentTarget.getAttribute('aria-expanded') !== 'true';
  e.currentTarget.setAttribute('aria-expanded', open);
  $('#flowBody').classList.toggle('open', open);
  $('#flowBody').inert = !open;
});
$('#flow').addEventListener('click', e => { const b = e.target.closest('[data-jump]'); if (b) jump(b.dataset.jump); });
function fillDemoLogin() {
  if (!isDev() || !$('#lgEmail')) return;
  $('#lgEmail').value = S.email; $('#lgPass').value = S.password;
  $('#lgMsg').hidden = true; $('#lgPassBox').classList.remove('bad'); $('#lgEmail').focus();
}
$('#noProjects').addEventListener('change', e => {
  S.noProjects = e.target.checked; S.homeFilter = 'ALL';
  if (!S.authed) return;
  if (S.noProjects) S.stack = [S.stack[0].name === 'login' ? S.stack[0] : { name: TABS.some(t => t[0] === S.stack[0].name) ? S.stack[0].name : 'home', params: {} }];
  render('fade');
});
$('#resetDemo').addEventListener('click', () => { DO.reset(); start(); });

/* Boot */
document.querySelector('#statusbar').innerHTML = `<span>9:41</span><span class="sb-icons">
  <svg width="18" height="12" viewBox="0 0 18 12"><rect y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" width="3" height="12" rx="1"/></svg>
  <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.3 10.3 0 0 0 8 .4C5.2.4 2.7 1.5.8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.7 6.7 0 0 0 8 4c-1.8 0-3.4.7-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3Zm0 3.5c-.5 0-1 .2-1.3.5L8 11.6l1.3-1.8c-.3-.3-.8-.5-1.3-.5Z"/></svg>
  <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2Z" opacity=".5"/></svg></span>`;
function start() {
  S = initialState();
  buildData();
  seenStatus = snapStatus();
  render('fade');
}
// Admin status changes (projects.js) reach this app live. BRD PM notifications: status change (with the suspend reason), ended.
let seenStatus = {};
const snapStatus = () => Object.fromEntries(PROJECTS.map(p => [p.code, computeStatus(p)]));
DO.onChange((origin, undone) => {
  const before = seenStatus;
  seenStatus = snapStatus();
  if (!undone) PROJECTS.filter(p => p.pms.includes('me')).forEach(p => {
    const was = before[p.code], is = seenStatus[p.code];
    if (!was || was === is) return;
    const note = is === 'ON_HOLD' ? { type: 'suspended', title: 'تغيّرت حالة المشروع إلى «معلق مؤقتًا»', body: `${p.name} — السبب: ${holdOf(p).reason}` }
      : is === 'ENDED' ? { type: 'ended', title: 'انتهت مدة المشروع دون تمديد', body: `${p.name} — انتهى في ${fmtDate(p.end)}` }
      : { type: was === 'ON_HOLD' ? 'resumed' : 'status', title: `تغيّرت حالة المشروع إلى «${STATUS[is].label}»`,
          body: `${p.name} — ${was === 'ON_HOLD' ? 'تم استئناف المشروع' : `تاريخ النهاية الآن ${fmtDate(p.end)}`}` };
    S.notes.push({ id: 'c' + Date.now() + p.code, unread: true, p: p.code, at: now(), ...note });
  });
  if (S.authed && cur().name !== 'login') render('stay'); else syncSide();
});
// Chips on desktop: the mouse wheel scrolls them sideways and the mouse can drag them (touch and trackpads scroll natively).
phone.addEventListener('wheel', e => {
  const row = e.target.closest('.chips');
  if (!row || Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
  const max = row.scrollWidth - row.clientWidth, x = Math.abs(row.scrollLeft);
  if ((e.deltaY > 0 && x >= max - 1) || (e.deltaY < 0 && x <= 0)) return;   // at an end: let the page scroll
  e.preventDefault(); row.scrollLeft -= e.deltaY;   // RTL: scrolling forward moves toward the left
}, { passive: false });
let chipDrag = null;
phone.addEventListener('pointerdown', e => {
  const row = e.target.closest('.chips');
  if (row && e.pointerType === 'mouse') chipDrag = { row, x: e.clientX, left: row.scrollLeft, moved: false };
});
phone.addEventListener('pointermove', e => {
  if (!chipDrag) return;
  const dx = e.clientX - chipDrag.x;
  if (Math.abs(dx) > 4) { chipDrag.moved = true; chipDrag.row.classList.add('dragging'); }
  if (chipDrag.moved) chipDrag.row.scrollLeft = chipDrag.left + dx;
});
addEventListener('pointerup', () => { if (chipDrag) { chipDrag.row.classList.remove('dragging'); setTimeout(() => { chipDrag = null; }, 0); } });
phone.addEventListener('click', e => { if (chipDrag && chipDrag.moved && e.target.closest('.chips')) { e.stopPropagation(); e.preventDefault(); } }, true);

DOIntro.bindSwipe(phone, () => cur().name === 'onboarding' && ACTIONS.obNext(), () => cur().name === 'onboarding' && ACTIONS.obPrev());

decorate(document.querySelector('.stage-bg'));
start();
</script>
