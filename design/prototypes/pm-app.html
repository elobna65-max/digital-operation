<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digital Operation — Project Manager App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Nunito+Sans:opsz,wght@6..12,400..900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/iconify-icon@2.1.0/dist/iconify-icon.min.js"></script>
<!--
  Digital Operation — Project Manager app (واجهة العميل / مدير المشروع). One connected, clickable, strictly read-only prototype.
  Design system: "Ember Pill Mobile", shared with employee-app.html. Behaviour: BRD summary in AGENTS.md.
  Static prototype, in-memory data only. Demo "today" is Monday 2026-11-02.
-->
<style>
  :root{
    --primary:#F37F46; --on-primary:#FFFFFF;
    --surface:#FFFFFF; --surface-alt:#F2F2F7;
    --on-surface:#000000; --muted:#6C6C70; --border:#E5E5EA;
    --success:#34C759; --error:#FF3B30; --warning:#FF9500;
    --blue:#007AFF; --indigo:#5856D6; --yellow:#F5C842;
    --r-md:14px; --r-lg:16px; --r-xl:24px; --r-2xl:28px; --r-3xl:32px; --r-full:9999px;
    --gutter:24px;
    --font:"Nunito Sans","Cairo",system-ui,sans-serif;
    --stage:#F6F6F8;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--stage);color:var(--on-surface);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
  button:disabled{cursor:default}
  a{color:inherit;text-decoration:none}
  button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  [hidden]{display:none!important}
  iconify-icon{display:inline-block;width:1em;height:1em;font-size:24px;flex:none}
  .latin{font-family:"Nunito Sans",sans-serif}
  .num{font-family:"Nunito Sans",sans-serif;font-weight:900;letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ───────── Stage ───────── */
  .stage{position:relative;min-height:100vh;padding:48px 24px 80px;overflow:hidden}
  .stage-bg{position:absolute;top:0;left:0;width:100%;height:1100px;pointer-events:none}
  .stage-bg path{fill:none;stroke:#E8E8ED;stroke-width:1.2}
  .stage-bg path.idx{stroke:#DEDEE4;stroke-width:1.8}
  .layout{position:relative;display:flex;gap:80px;justify-content:center;align-items:flex-start;max-width:1100px;margin:0 auto}
  .side{width:330px;flex:none;position:sticky;top:32px}
  .kicker-latin{font-family:"Nunito Sans";font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .stage-title{margin:10px 0 6px;font-family:"Nunito Sans";font-weight:900;font-size:clamp(38px,5vw,52px);line-height:.95;letter-spacing:-0.04em;direction:ltr;text-align:right}
  .stage-title span{color:var(--primary)}
  .stage-sub{margin:0 0 22px;font-size:14px;font-weight:600;color:var(--muted)}
  .side-card{background:#fff;border-radius:var(--r-xl);padding:16px 18px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .side-card h4{margin:0 0 10px;font-size:12px;font-weight:800;color:var(--muted)}
  .side-card h4.disclosure{margin:0}
  .disclosure button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;margin:-4px 0;padding:4px 0;font:inherit;color:inherit;text-align:start}
  .disclosure iconify-icon{font-size:16px;transition:transform .25s ease}
  .disclosure button[aria-expanded="true"] iconify-icon{transform:rotate(180deg)}
  .collapse{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}
  .collapse.open{grid-template-rows:1fr}
  .collapse > *{min-height:0;overflow:hidden}
  .collapse .flow{padding-top:10px}
  .side-btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface-alt);border-radius:var(--r-full);padding:8px 14px;font-size:12px;font-weight:800;margin-top:10px}
  .side-btn iconify-icon{font-size:16px}
  .side-note{margin:10px 0 0;font-size:12px;font-weight:600;line-height:18px;color:var(--muted)}
  .flow{display:flex;flex-direction:column;gap:2px}
  .flow button{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:var(--r-full);font-size:13px;font-weight:700;color:var(--muted);text-align:start;transition:background .15s}
  .flow button:hover{background:var(--surface-alt)}
  .flow .n{font-family:"Nunito Sans";font-weight:900;font-size:12px;color:#C7C7CC;width:20px}
  .flow button[aria-current="true"]{background:var(--surface-alt);color:#000}
  .flow button[aria-current="true"] .n{color:var(--primary)}
  .switch{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;font-weight:700;cursor:pointer}
  .switch input{appearance:none;width:40px;height:24px;border-radius:999px;background:#E5E5EA;position:relative;cursor:pointer;transition:background .2s;flex:none;margin:0}
  .switch input::after{content:"";position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:right .2s}
  .switch input:checked{background:var(--primary)}
  .switch input:checked::after{right:18px}

  /* ───────── Device ───────── */
  .phone{position:relative;width:390px;height:844px;border-radius:56px;background:var(--surface);overflow:hidden;isolation:isolate;flex:none;
    box-shadow:0 0 0 10px #0B0B0C,0 0 0 11px #2C2C2E,0 50px 90px -30px rgba(0,0,0,.35),0 30px 70px -30px rgba(243,127,70,.25)}
  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:var(--r-full);background:#000;z-index:80}
  .statusbar{position:absolute;top:0;left:0;right:0;height:54px;padding:0 30px 0 36px;display:flex;justify-content:space-between;align-items:center;z-index:75;font-family:"Nunito Sans";font-weight:800;font-size:16px;pointer-events:none;transition:color .2s}
  .statusbar.light{color:#fff}
  .statusbar svg{fill:currentColor}
  .sb-icons{display:flex;gap:6px;align-items:center}
  .home-ind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:var(--r-full);background:#000;z-index:80;pointer-events:none}
  .view{position:absolute;inset:0}
  .screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;background:#fff}
  .screen::-webkit-scrollbar{display:none}
  .screen.fwd{animation:inFwd .32s cubic-bezier(.2,.8,.2,1)}
  .screen.bk{animation:inBack .32s cubic-bezier(.2,.8,.2,1)}
  .screen.fade{animation:fadeIn .22s ease}
  @keyframes inFwd{from{transform:translateX(-22%);opacity:0}}
  @keyframes inBack{from{transform:translateX(22%);opacity:0}}
  @keyframes fadeIn{from{opacity:0}}
  @keyframes sheetUp{from{transform:translateY(100%)}}
  .sb-bg{position:sticky;top:0;height:54px;margin-bottom:-54px;background:rgba(255,255,255,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:20}
  .body{padding:64px var(--gutter) 48px}
  .body.with-dock{padding-bottom:130px}
  .body.with-tabs{padding-bottom:150px}

  /* ───────── Components ───────── */
  .kicker{font-size:12px;font-weight:800;color:var(--muted)}
  .kicker-sm{font-size:12px;font-weight:700;color:var(--muted);line-height:18px}
  .h-lg{margin:2px 0 4px;font-size:24px;font-weight:800;line-height:34px}
  .h-md{font-size:18px;font-weight:800;line-height:26px;margin:0}
  .lede{margin:0 0 20px;font-size:14px;font-weight:600;line-height:22px;color:var(--muted)}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
  .field label,.field .label{font-size:12px;font-weight:700;padding-inline-start:18px}
  .req{color:#D70015}
  .input{display:flex;align-items:center;gap:10px;background:var(--surface-alt);border-radius:var(--r-full);padding:0 18px;height:54px;transition:box-shadow .15s}
  .input:focus-within{box-shadow:0 0 0 2px var(--primary)}
  .input > iconify-icon{font-size:20px;color:var(--muted)}
  .input input{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:0;font-family:"Nunito Sans","Cairo";font-size:14px;font-weight:700;color:#000;text-align:right}
  .input input::placeholder{color:#AEAEB2;font-weight:600}
  .input.bad{box-shadow:0 0 0 2px rgba(255,59,48,.55)}
  .input.locked .val{flex:1;font-size:14px;font-weight:800}
  .eye{width:36px;height:36px;margin-inline-end:-10px;border-radius:var(--r-full);display:grid;place-items:center;color:var(--muted)}
  .eye iconify-icon{font-size:20px}
  .hint{font-size:12px;font-weight:600;line-height:18px;color:var(--muted);padding-inline-start:18px}
  .hint.err{color:#D70015}
  .msg{display:flex;gap:8px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-lg);font-size:12px;font-weight:700;line-height:19px;margin:2px 0 12px}
  .msg iconify-icon{font-size:20px}
  .msg-error{background:rgba(255,59,48,.08);color:#D70015}
  .msg-warn{background:rgba(255,149,0,.10);color:#B25000}
  .msg-info{background:var(--surface-alt);color:var(--muted)}
  .msg-ok{background:rgba(52,199,89,.12);color:#248A3D}
  .btn-primary{position:relative;margin-top:8px;width:100%;height:56px;border-radius:var(--r-full);background:var(--primary);color:#fff;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;
    box-shadow:0 12px 30px -8px rgba(243,127,70,.45);transition:transform .15s}
  .btn-primary:active{transform:scale(.97)}
  .btn-primary iconify-icon{font-size:20px}
  .btn-primary.sm{height:48px;font-size:13px;margin:0;flex:1}
  .btn-primary .spin{display:none}
  .btn-primary.loading > :not(.spin){display:none}
  .btn-primary.loading .spin{display:block;width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .btn-sec,.btn-danger{flex:1;height:48px;border-radius:var(--r-full);background:var(--surface-alt);font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s}
  .btn-danger{background:rgba(255,59,48,.1);color:#D70015}
  .btn-sec:active,.btn-danger:active{transform:scale(.97)}
  .btn-row{display:flex;gap:8px;margin-top:14px}
  .avatar{width:44px;height:44px;border-radius:var(--r-full);background:var(--surface-alt);display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
  .avatar.sm{width:36px;height:36px;font-size:14px;background:#fff}
  .avatar.xl{width:88px;height:88px;font-size:34px;margin:0 auto 14px}
  .icon-btn{position:relative;width:40px;height:40px;border-radius:var(--r-full);background:var(--surface-alt);display:grid;place-items:center;flex:none;transition:transform .15s,opacity .15s}
  .icon-btn:active{transform:scale(.92)}
  .icon-btn:disabled{opacity:.35;transform:none}
  .icon-btn.white{background:#fff}
  .icon-btn.sm{width:36px;height:36px}
  .icon-btn.sm iconify-icon{font-size:20px}
  .badge{position:absolute;top:-2px;inset-inline-end:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:var(--r-full);background:var(--primary);color:#fff;font-family:"Nunito Sans";font-size:10px;font-weight:900;display:grid;place-items:center;box-shadow:0 0 0 2px #fff}
  .halo{width:44px;height:44px;border-radius:var(--r-full);background:#fff;display:grid;place-items:center;flex:none}
  .halo.photo{background:#E7E2DC center/cover no-repeat}
  .halo.photo iconify-icon{font-size:16px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.4))}
  .pcover{display:block;height:140px;border-radius:18px;background:#E7E2DC center/cover no-repeat}
  .pcover.lg{height:208px;border-radius:var(--r-3xl);margin-bottom:12px}
  .halo iconify-icon{font-size:22px}
  .tag{font-size:10px;font-weight:800;padding:3px 8px;border-radius:var(--r-full);background:#fff;color:var(--muted);white-space:nowrap}
  .tag2{background:var(--surface-alt);padding:6px 12px;border-radius:var(--r-full);font-size:12px;font-weight:800}
  .sec-head{display:flex;justify-content:space-between;align-items:flex-end;margin:34px 0 14px}
  .sec-sub{font-size:12px;font-weight:600;color:var(--muted);line-height:18px}
  .text-btn{display:inline-flex;align-items:center;gap:2px;color:var(--primary);font-size:13px;font-weight:800}
  .text-btn iconify-icon{font-size:18px}
  .more-btn{display:flex;width:100%;justify-content:center;align-items:center;gap:6px;margin-top:12px;height:44px;border-radius:var(--r-full);background:var(--surface-alt);font-size:12px;font-weight:800}
  .seg{display:flex;gap:2px;background:rgba(242,242,247,.7);padding:4px;border-radius:20px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px}
  .seg::-webkit-scrollbar{display:none}
  .seg button{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;border-radius:var(--r-md);font-size:12px;font-weight:600;color:var(--muted)}
  .seg.fill button{flex:1}
  .seg button[aria-pressed="true"]{background:#fff;color:#000;font-weight:800;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .seg .c{font-family:"Nunito Sans";font-size:11px;font-weight:900;opacity:.55}
  /* File-type filter: runs to 16px from the screen edges; options share the width, scroll sideways when they do not fit */
  .seg.bleed{margin-inline:calc(16px - var(--gutter))}
  .seg.bleed button{flex:1 0 auto}
  /* Home status filter: separate chips in a sideways scroller that runs to the screen edges, so the next chip peeks in. */
  .chips{display:flex;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;scroll-padding-inline:var(--gutter);scrollbar-width:none;
    margin:0 calc(var(--gutter) * -1) 10px;padding:4px var(--gutter) 8px;cursor:grab;
    -webkit-mask-image:linear-gradient(to left,transparent 0,#000 12px,#000 calc(100% - 12px),transparent 100%);mask-image:linear-gradient(to left,transparent 0,#000 12px,#000 calc(100% - 12px),transparent 100%)}
  .chips::-webkit-scrollbar{display:none}
  .chips.dragging{cursor:grabbing;scroll-snap-type:none}
  .chip{flex:none;scroll-snap-align:start;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:var(--r-full);background:var(--surface-alt);color:#3A3A3C;font-size:12px;font-weight:800;white-space:nowrap;transition:background .2s,color .2s,box-shadow .2s,transform .15s}
  .chip:active{transform:scale(.96)}
  .chip i{width:8px;height:8px;border-radius:50%;flex:none}
  .chip .c{font-family:"Nunito Sans";font-size:11px;font-weight:900;opacity:.5}
  .chip[aria-pressed="true"]{background:var(--primary);color:#fff;box-shadow:0 8px 18px -10px rgba(243,127,70,.85)}
  .chip[aria-pressed="true"] i{background:#fff!important}
  .chip[aria-pressed="true"] .c{opacity:.85}
  .pip{display:inline-flex;align-items:center;flex:none;gap:6px;height:24px;padding:0 10px;border-radius:var(--r-full);font-size:11px;font-weight:800;line-height:16px;white-space:nowrap;transition:opacity .15s}
  .pip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .pip-success{background:rgba(52,199,89,.12);color:#248A3D}
  .pip-warning{background:rgba(255,149,0,.12);color:#B25000}
  .pip-neutral{background:rgba(108,108,112,.12);color:#48484A}
  .pip-blue{background:rgba(0,122,255,.10);color:#0062CC}
  .pip.off{opacity:.35}
  .pip.on-hero{background:#fff;box-shadow:0 6px 16px -8px rgba(0,0,0,.3)}
  .card-head > .pip{align-self:flex-start}
  .code{font-family:"Nunito Sans";font-size:11px;font-weight:800;letter-spacing:.06em;direction:ltr;unicode-bidi:isolate}
  .dot{width:3px;height:3px;border-radius:50%;background:#C7C7CC;flex:none}
  .chev{font-size:20px!important;color:rgba(108,108,112,.45)}
  .chip-btn{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:var(--r-full);padding:7px 12px 7px 14px;font-size:12px;font-weight:800;transition:transform .15s;white-space:nowrap}
  .chip-btn:active{transform:scale(.95)}
  .chip-btn iconify-icon{font-size:18px;color:var(--primary)}
  .chip-btn.pearl{background:var(--surface-alt)}
  .link{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:700;white-space:nowrap}
  .link iconify-icon{font-size:16px;color:var(--muted)}
  .note{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:700;color:var(--muted)}
  .note iconify-icon{font-size:16px}
  .empty{background:var(--surface-alt);border-radius:var(--r-2xl);padding:32px 24px;text-align:center}
  .empty .halo{margin:0 auto 14px;width:56px;height:56px}
  .empty .halo iconify-icon{font-size:26px;color:#AEAEB2}
  .empty strong{display:block;font-size:16px;font-weight:800;line-height:24px}
  .empty p{margin:6px 0 0;font-size:12px;font-weight:600;line-height:20px;color:var(--muted)}
  .stack{display:flex;flex-direction:column;gap:12px}
  .panel{background:var(--surface-alt);border-radius:var(--r-2xl);padding:20px}
  .panel h4{margin:0 0 8px;font-size:16px;font-weight:800;line-height:24px}
  .panel p{margin:0;font-size:14px;font-weight:600;line-height:24px}
  .panel.stack{gap:16px}

  /* Login */
  .art{position:relative;margin:8px 8px 0;height:330px;border-radius:48px;background:var(--surface-alt);overflow:hidden}
  .art.photo{background-size:cover;background-position:center}
  .art.photo::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(23,22,27,.82) 0%,rgba(23,22,27,.42) 24%,rgba(23,22,27,0) 44%,rgba(252,249,245,0) 62%,rgba(252,249,245,.8) 100%)}   /* dark top so the white logo text reads clearly */
  .art.photo .contours path{stroke:rgba(255,255,255,.38)}
  .art-svg{position:absolute;inset:0;width:100%;height:100%}
  .art-svg .contours path{fill:none;stroke:#fff;stroke-width:1.3}
  .art-svg .contours path.idx{stroke-width:2.4}
  .art-svg .route{fill:none;stroke:#000;stroke-width:1.6;stroke-dasharray:1.5 6;stroke-linecap:round;opacity:.5}
  .art-svg .core{fill:var(--primary)}
  .art-svg .ring{fill:none;stroke:var(--primary);stroke-width:1.4;transform-box:fill-box;transform-origin:center;animation:ping 3.4s cubic-bezier(.2,.6,.3,1) infinite}
  .art-svg .ring.r2{animation-delay:1.7s}
  @keyframes ping{0%{transform:scale(.7);opacity:.8}100%{transform:scale(2.8);opacity:0}}
  .art-top{position:absolute;top:62px;inset-inline:20px;display:flex;justify-content:space-between;align-items:center}
  .brand{display:flex;align-items:center;gap:10px}
  .brand-name{font-family:"Nunito Sans";font-weight:900;font-size:15px;letter-spacing:-0.01em;line-height:1.1;color:#FFFFFF}
  .brand-sub{font-size:11px;font-weight:700;color:#E0E4E8;line-height:1.3}
  /* Login logo animation: pops in, the ring draws itself, the orange dot circles in once, then a soft halo pulse. */
  .brand-mark{position:relative;display:block;width:38px;height:38px;flex:none;animation:bmIn .7s cubic-bezier(.2,.9,.3,1.25) both}
  .brand-mark svg{position:relative;display:block}
  .brand-mark i{position:absolute;inset:0;border-radius:50%;animation:bmHalo 2.8s ease-out 1.7s infinite}
  .bm-ring{stroke-dasharray:50.3;stroke-dashoffset:50.3;animation:bmRing .9s ease-out .25s forwards}
  .bm-orbit{transform-box:view-box;transform-origin:19px 19px;animation:bmOrbit 1.2s cubic-bezier(.45,0,.2,1) .5s both}
  .brand > div{animation:bmText .5s ease .35s both}
  @keyframes bmIn{from{transform:scale(.55) rotate(-25deg);opacity:0}}
  @keyframes bmRing{to{stroke-dashoffset:0}}
  @keyframes bmOrbit{from{transform:rotate(-360deg);opacity:0}25%{opacity:1}}
  @keyframes bmHalo{0%{box-shadow:0 0 0 0 rgba(255,255,255,.45)}70%,100%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}
  @keyframes bmText{from{opacity:0;transform:translateY(4px)}}
  @media (prefers-reduced-motion:reduce){.brand-mark,.brand-mark i,.bm-orbit,.brand > div{animation:none}.bm-ring{animation:none;stroke-dashoffset:0}}
  /* Dev-only demo fill, right under the image. */
  .login-actions{display:flex;margin-bottom:22px}
  .dev-fill{position:relative;display:flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:var(--r-full);background:#fff;border:1.5px dashed rgba(243,127,70,.75);font-size:12px;font-weight:800;white-space:nowrap;transition:transform .15s}
  .dev-fill:active{transform:scale(.97)}
  .dev-fill .env{position:absolute;top:-9px;inset-inline-start:16px}
  .dev-fill .env{font-family:"Nunito Sans";font-size:10px;font-weight:900;letter-spacing:.08em;line-height:1;background:var(--primary);color:#fff;border-radius:var(--r-full);padding:5px 7px}
  .art-foot{position:absolute;bottom:20px;inset-inline:24px;display:flex;justify-content:flex-end}
  .coord{font-family:"Nunito Sans";font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--muted);direction:ltr;unicode-bidi:isolate}
  .login-form{padding:26px var(--gutter) 40px;display:flex;flex-direction:column}
  .help{display:flex;gap:8px;align-items:flex-start;margin:18px 6px 0;font-size:12px;font-weight:600;line-height:19px;color:var(--muted)}
  .help iconify-icon{font-size:18px;color:#AEAEB2}
  /* Login: soft warm cream easing into light beige, with a faint orange glow (the splash and onboarding accent) */
  .login{display:flow-root;min-height:100%;padding-bottom:8px;background:
    radial-gradient(90% 40% at 50% 104%,rgba(243,127,70,.16),rgba(243,127,70,0) 70%),
    radial-gradient(70% 30% at 0% 46%,rgba(243,127,70,.06),rgba(243,127,70,0) 70%),
    linear-gradient(180deg,#FCF9F5 0%,#F9F3EC 40%,#F5EADF 75%,#F2E2D3 100%)}
  .login .input{background:#fff;box-shadow:0 6px 18px -12px rgba(90,50,20,.28)}
  .login .input:focus-within{box-shadow:0 0 0 2px var(--primary),0 6px 18px -12px rgba(90,50,20,.28)}
  .login .input.bad{box-shadow:0 0 0 2px rgba(255,59,48,.55)}
  /* Demo login: the browser must not prefill saved credentials; if it autofills anyway, keep the white field instead of its blue tint */
  .login .input input:-webkit-autofill,.login .input input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 40px #fff inset;-webkit-text-fill-color:#000;caret-color:#000}
  /* Photo runs edge to edge (the phone frame clips the top corners); height grows with the width (374:330) and the brand keeps its place */
  .login .art{margin:0;height:344px;border-radius:0}
  .login .art-top{top:70px}

  /* Home */
  .appbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  .who{display:flex;align-items:center;gap:12px}
  .hero{position:relative;overflow:hidden;background:var(--primary);color:#fff;border-radius:var(--r-3xl);padding:24px;box-shadow:0 10px 25px -5px rgba(243,127,70,.20)}
  .hero-art{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .hero-art path{fill:none;stroke:rgba(255,255,255,.22);stroke-width:1.2}
  .hero-art path.idx{stroke:rgba(255,255,255,.32);stroke-width:2}
  .hero > :not(.hero-art){position:relative}
  .hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .hero-label{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:700;color:rgba(255,255,255,.88)}
  .hero-label iconify-icon{font-size:20px}
  .hero-num{display:flex;align-items:baseline;gap:12px;margin:22px 0 22px}
  .hero-num .num{font-size:56px;line-height:1}
  .hero-num .unit{font-size:14px;font-weight:700;opacity:.9}
  .hero-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .hero-title{margin:14px 0 18px;font-size:24px;font-weight:800;line-height:34px}
  .btn-white{background:#fff;color:#000;border-radius:var(--r-full);padding:10px 16px 10px 18px;font-size:13px;font-weight:800;display:inline-flex;gap:8px;align-items:center;box-shadow:0 10px 24px -10px rgba(0,0,0,.35);transition:transform .15s}
  .btn-white:active{transform:scale(.96)}
  .btn-white iconify-icon{font-size:18px;color:var(--primary)}
  .badge-pill{background:rgba(255,255,255,.2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:6px 12px;border-radius:var(--r-full);font-size:12px;font-weight:700;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
  .badge-pill iconify-icon{font-size:16px}
  .dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
  .dates div{background:rgba(255,255,255,.16);border-radius:var(--r-lg);padding:10px 14px}
  .dates span{display:block;font-size:12px;font-weight:700;opacity:.85}
  .dates strong{font-size:14px;font-weight:800}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  /* Home summary tiles (direction C from home-tiles-concepts.html): a soft wash of the tile's colour, a large 3D icon in the corner */
  .tile{position:relative;overflow:hidden;background:linear-gradient(160deg,#E6F0FF 0%,#EEF2FA 45%,var(--surface-alt) 100%);border-radius:var(--r-2xl);padding:18px;display:flex;flex-direction:column;min-height:172px}
  .tile.pend{background:linear-gradient(160deg,#FFEBDD 0%,#F8EEE8 45%,var(--surface-alt) 100%)}
  .tile .ico3d{position:absolute;top:12px;left:9px;width:64px;height:64px;pointer-events:none;user-select:none;filter:drop-shadow(0 12px 14px rgba(0,0,0,.12))}
  .tile .tag{background:rgba(255,255,255,.75)}
  .tile-val .num{font-size:34px;line-height:1;display:block}
  .tile-label{font-size:12px;font-weight:700;color:var(--muted);line-height:18px;margin-top:6px}
  .tile-foot{margin-top:auto;padding-top:12px}
  .tile-foot .tile-label{margin-top:8px}   /* labels sit under the tag, clear of the 3D icon */
  .tile .bars{height:30px;margin:10px 0 0}
  .tile .bars i{background:rgba(255,255,255,.8)}
  .bars{display:flex;gap:4px;align-items:flex-end;height:34px;margin:14px 0 12px}
  .bars i{flex:1;height:100%;background:#fff;border-radius:6px 6px 4px 4px;position:relative;overflow:hidden}
  .bars i b{position:absolute;bottom:0;left:0;right:0;background:rgba(243,127,70,.4);border-radius:inherit}
  .bars i.today b{background:var(--primary)}
  .list{display:flex;flex-direction:column;gap:12px}
  .card{background:var(--surface-alt);border-radius:var(--r-2xl);padding:20px;display:flex;flex-direction:column;gap:16px;cursor:pointer;animation:rise .35s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}}
  .card.static{cursor:default;animation:none}
  .card-head{display:flex;gap:12px;align-items:flex-start}
  .card-title{flex:1;min-width:0}
  .card-title h3{margin:0;font-size:16px;font-weight:800;line-height:24px}
  .card-meta{display:flex;gap:6px;align-items:center;margin-top:1px;font-size:12px;font-weight:600;color:var(--muted)}
  .facts{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
  .facts span{display:flex;gap:6px;align-items:center}
  .facts iconify-icon{font-size:15px;color:#AEAEB2}
  .card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:34px}
  .post{background:var(--surface-alt);border-radius:var(--r-2xl);padding:18px 20px;display:flex;flex-direction:column;gap:12px;cursor:pointer;text-align:start;width:100%}
  .post-head{display:flex;gap:10px;align-items:center}
  .post-who{flex:1;min-width:0}
  .post-who strong{display:block;font-size:14px;font-weight:800;line-height:20px}
  .post-who span{font-size:11px;font-weight:700;color:var(--muted)}
  .post-time{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
  .post p{margin:0;font-size:14px;font-weight:600;line-height:22px;unicode-bidi:plaintext}
  .atts{display:flex;gap:6px;flex-wrap:wrap}
  .att{display:inline-flex;gap:5px;align-items:center;background:#fff;border-radius:var(--r-full);padding:5px 10px;font-size:11px;font-weight:800}
  .att iconify-icon{font-size:14px}

  /* Sub-screens */
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .topbar .t{flex:1;min-width:0;text-align:center}
  .topbar h2{margin:0;font-size:18px;font-weight:800;line-height:26px}
  .topbar .k{font-size:12px;font-weight:700;color:var(--muted);line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar .spacer{width:40px;flex:none}
  .dock{position:absolute;left:0;right:0;bottom:0;z-index:25;padding:14px var(--gutter) 30px;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  .dock .btn-primary{margin-top:0}
  .loc{background:var(--surface-alt);border-radius:var(--r-2xl);padding:8px;margin-top:12px}
  .loc-map{position:relative;height:150px;border-radius:22px;background:#fff;overflow:hidden}
  .loc-map svg{position:absolute;inset:0;width:100%;height:100%}
  .loc-map path{fill:none;stroke:#ECECF1;stroke-width:1.2}
  .loc-map path.idx{stroke:#E2E2E8;stroke-width:2}
  .loc-map .road{stroke:#F2F2F7;stroke-width:6;stroke-linecap:round}
  .loc-pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 6px 16px -4px rgba(0,0,0,.22);display:grid;place-items:center}
  .loc-pin i{width:16px;height:16px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 4px rgba(243,127,70,.2)}
  .loc-info{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 12px 10px}
  .loc-info strong{display:block;font-size:14px;font-weight:800;line-height:20px}
  .person{display:flex;align-items:center;gap:12px}
  .person strong{display:block;font-size:14px;font-weight:800;line-height:20px}
  .person span{font-size:12px;font-weight:600;color:var(--muted)}
  .mini{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start}
  .mini-body{flex:1;min-width:0}
  .mini-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .mini-top strong{font-size:14px;font-weight:800;line-height:20px}
  .mini-top span{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
  .mini p{margin:2px 0 0;font-size:12px;font-weight:600;line-height:18px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mini .cnt{display:inline-flex;gap:3px;align-items:center;font-size:11px;font-weight:800;color:var(--muted)}
  .mini .cnt iconify-icon{font-size:13px}
  .lrow{display:flex;align-items:center;gap:14px;background:var(--surface-alt);border-radius:var(--r-2xl);padding:16px 20px;width:100%;text-align:start;margin-top:12px}
  .lrow .grow{flex:1;min-width:0}
  .lrow strong{display:block;font-size:16px;font-weight:800;line-height:22px}
  .lrow span{font-size:12px;font-weight:600;color:var(--muted)}
  .thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .thumb{position:relative;aspect-ratio:1;border-radius:var(--r-lg);overflow:hidden;background:#E7E2DC;display:block}
  .thumb svg{position:absolute;inset:0;width:100%;height:100%}
  .thumb path{fill:none;stroke:rgba(255,255,255,.65);stroke-width:1.1}
  .thumb.t2{background:#DEE2E7}.thumb.t3{background:#E4DACD}.thumb.t4{background:#DCE2DA}
  .thumb.has-img{background-size:cover;background-position:center}
  .thumb .ov{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-family:"Nunito Sans";font-weight:900;font-size:16px;background:rgba(0,0,0,.35)}
  .thumb .play{position:absolute;inset:0;margin:auto;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#000}
  .thumb .play iconify-icon{font-size:16px}
  .thumb-btn{display:block;border-radius:var(--r-lg);transition:transform .15s}
  .thumb-btn:active{transform:scale(.96)}
  .day-head{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 10px;font-size:12px;font-weight:800;color:var(--muted)}
  .day-head.first{margin-top:0}
  .textarea{background:var(--surface-alt);border-radius:var(--r-xl);padding:16px 18px;transition:box-shadow .15s}
  .textarea:focus-within{box-shadow:0 0 0 2px var(--primary)}
  .textarea.bad{box-shadow:0 0 0 2px rgba(255,59,48,.55)}
  .textarea textarea{display:block;width:100%;min-height:118px;border:0;background:transparent;outline:0;resize:none;font:600 14px/22px var(--font);color:#000}
  .textarea textarea::placeholder{color:#AEAEB2}
  .att-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .att-tile{position:relative;aspect-ratio:1;border-radius:20px;background:var(--surface-alt);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:800;color:var(--muted)}
  .att-tile.thumb{background-color:#E7E2DC}
  .att-tile.add{color:#000}
  .att-tile.add iconify-icon{color:var(--primary);font-size:26px}
  .att-tile .fname-s{font-family:"Nunito Sans","Cairo";font-size:10px;font-weight:800;color:#000;padding:0 8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr}
  .att-x{position:absolute;top:6px;inset-inline-end:6px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;z-index:2}
  .att-x iconify-icon{font-size:14px}
  .src-btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .meta-grid div{background:var(--surface-alt);border-radius:20px;padding:12px 14px}
  .meta-grid span{display:block;font-size:12px;font-weight:700;color:var(--muted)}
  .meta-grid strong{font-size:14px;font-weight:800}
  .flist{display:flex;flex-direction:column;gap:8px}
  .frow{display:flex;align-items:center;gap:12px;background:var(--surface-alt);border-radius:var(--r-xl);padding:12px 14px}
  .frow .grow{flex:1;min-width:0}
  .fname{display:block;font-size:14px;font-weight:800;line-height:20px;unicode-bidi:plaintext;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fmeta{display:flex;gap:6px;align-items:center;margin-top:2px;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden}
  .fmeta .latin{font-weight:800;direction:ltr;unicode-bidi:isolate}

  /* Map */
  .map{position:absolute;inset:0;background:#EDEDF1}
  .map > svg{position:absolute;inset:0;width:100%;height:100%}
  .map .contours path{fill:none;stroke:#fff;stroke-width:1.2}
  .map .contours path.idx{stroke-width:2.2}
  .map .sea{fill:#E2E7EE}
  .map .road{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;opacity:.9}
  .pin{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:#fff;box-shadow:0 6px 14px -4px rgba(0,0,0,.28);display:grid;place-items:center;transition:transform .2s;z-index:3}
  .pin i{width:12px;height:12px;border-radius:50%}
  .pin.sel{transform:translate(-50%,-50%) scale(1.3);z-index:4}
  .pin-label{position:absolute;transform:translate(-50%,calc(-100% - 26px));background:#000;color:#fff;font-size:12px;font-weight:800;padding:6px 12px;border-radius:var(--r-full);white-space:nowrap;z-index:5;pointer-events:none}
  .map-top{position:absolute;top:60px;inset-inline:16px;z-index:6;display:flex;flex-direction:column;gap:8px;align-items:stretch}
  .glass{background:rgba(255,255,255,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(229,229,234,.5);border-radius:var(--r-full);box-shadow:0 8px 30px rgba(0,0,0,.08)}
  .map-title{display:flex;justify-content:space-between;align-items:center;padding:6px;padding-inline-start:18px}
  .map-title strong{font-size:16px;font-weight:800}
  /* Status filter: one row, full width like the title bar above; badges share the width and scroll sideways if they ever overflow */
  .map-legend{display:flex;gap:3px;padding:4px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none}
  .map-legend::-webkit-scrollbar{display:none}
  .map-legend .pip{flex:1 0 auto;justify-content:center}
  .sheet{position:absolute;inset-inline:12px;bottom:110px;z-index:6;background:#fff;border-radius:var(--r-3xl);padding:18px;box-shadow:0 8px 30px rgba(0,0,0,.12)}
  .grab{width:36px;height:5px;border-radius:9px;background:#E5E5EA;margin:-6px auto 12px}

  /* Calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px}
  .cal-nav{display:flex;gap:6px;align-items:center}
  .wk,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .wk{margin-bottom:6px;font-size:11px;font-weight:800;color:var(--muted);text-align:center}
  .d{position:relative;aspect-ratio:1;border-radius:var(--r-md);background:var(--surface-alt);display:grid;place-items:center;font-family:"Nunito Sans";font-size:13px;font-weight:800;color:#000;transition:box-shadow .15s}
  .d.blank{background:transparent}
  .d.rest{color:#AEAEB2}
  .d.future{background:transparent;color:#D1D1D6}
  .d.l1{background:rgba(243,127,70,.2)}
  .d.l2{background:rgba(243,127,70,.4)}
  .d.l3{background:var(--primary);color:#fff;box-shadow:0 4px 10px -4px rgba(243,127,70,.4)}
  .d.today::after{content:"";position:absolute;bottom:5px;left:50%;margin-left:-2px;width:4px;height:4px;border-radius:50%;background:currentColor}
  .d.sel{box-shadow:0 0 0 2px #fff,0 0 0 4px #000}
  .cal-legend{display:flex;align-items:center;gap:5px;justify-content:flex-end;font-size:11px;font-weight:700;color:var(--muted);margin-top:14px}
  .cal-legend i{width:14px;height:14px;border-radius:5px;background:var(--surface-alt)}

  /* Notifications */
  .ngroup{font-size:12px;font-weight:800;color:var(--muted);margin:20px 6px 8px}
  .ngroup.first{margin-top:4px}
  .nrow{position:relative;display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:var(--r-xl);width:100%;text-align:start;margin-bottom:6px;transition:background .2s}
  .nrow.unread{background:var(--surface-alt)}
  .nrow .halo{width:40px;height:40px;background:var(--surface-alt)}
  .nrow.unread .halo{background:#fff}
  .nbody{flex:1;min-width:0;display:block}
  .nbody strong{display:block;font-size:14px;font-weight:800;line-height:20px;padding-inline-end:14px}
  .nbody .nt{display:block;margin:2px 0 6px;font-size:12px;font-weight:600;color:var(--muted);line-height:18px}
  .nfoot{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .ntime{font-size:11px;font-weight:700;color:#AEAEB2}
  .nolink{display:inline-flex;gap:4px;align-items:center;font-size:11px;font-weight:700;color:#AEAEB2}
  .nolink iconify-icon{font-size:14px}
  .ndot{position:absolute;top:22px;inset-inline-end:16px;width:8px;height:8px;border-radius:50%;background:var(--primary)}

  /* Profile */
  .prof{text-align:center;margin:8px 0 26px}
  .prof h2{font-size:24px;font-weight:800;line-height:34px;margin:0}
  .prof .sub{font-size:14px;font-weight:600;color:var(--muted)}
  .prof .chips{display:flex;gap:6px;justify-content:center;margin-top:12px}
  .group-label{font-size:12px;font-weight:800;color:var(--muted);margin:22px 18px 8px}
  .gcard{background:var(--surface-alt);border-radius:var(--r-2xl);padding:6px 0}
  .grow-row{display:flex;align-items:center;gap:12px;padding:12px 18px;width:100%;text-align:start}
  .grow-row .halo{width:38px;height:38px}
  .grow-row .halo iconify-icon{font-size:20px}
  .kv{flex:1;min-width:0}
  .kv span{display:block;font-size:12px;font-weight:700;color:var(--muted);line-height:18px}
  .kv strong{display:block;font-size:14px;font-weight:800;line-height:20px;unicode-bidi:plaintext;text-align:right}
  .grow-row .act{font-size:12px;font-weight:800;color:var(--muted);display:inline-flex;align-items:center;gap:2px}
  .danger{color:#D70015}
  .foot-note{text-align:center;font-size:11px;font-weight:700;color:#AEAEB2;margin-top:22px}

  /* Overlays */
  .tabbar{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);width:90%;z-index:30;display:flex;padding:6px;
    background:rgba(255,255,255,.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(229,229,234,.5);border-radius:var(--r-full);box-shadow:0 8px 30px rgba(0,0,0,.12)}
  .tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 9px;border-radius:var(--r-full);color:var(--muted);font-size:11px;font-weight:700;transition:transform .15s}
  .tab:active{transform:scale(.95)}
  .tab.active{background:var(--surface-alt);color:var(--primary);box-shadow:inset 0 1px 2px rgba(0,0,0,.04)}
  .tab.active::before{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(243,127,70,.10)}
  .tab iconify-icon,.tab span{position:relative}

<script>
/* ═════════════════════ Helpers ═════════════════════ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
const WD = ['الأحد', 'الاثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parse = s => new Date(s + 'T00:00:00');
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const fmtDate = s => { const d = parse(s); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const fmtDay = s => { const d = parse(s); return `${WD[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; };
const fmtTime = d => { let h = d.getHours(); const m = d.getMinutes(), ap = h < 12 ? 'ص' : 'م'; h = h % 12 || 12; return `${h}:${String(m).padStart(2, '0')} ${ap}`; };
// Arabic counted nouns: 0 / 1 / 2 / 3–10 / 11+
const countAr = (n, zero, one, two, few, many) => n === 0 ? zero : n === 1 ? one : n === 2 ? two : n <= 10 ? `${n} ${few}` : `${n} ${many}`;
const nUpdates = n => countAr(n, 'لا توجد تحديثات', 'تحديث واحد', 'تحديثان', 'تحديثات', 'تحديثًا');
const nFiles = n => countAr(n, 'لا توجد ملفات', 'ملف واحد', 'ملفان', 'ملفات', 'ملفًا');
const nAtts = n => countAr(n, 'بلا مرفقات', 'مرفق واحد', 'مرفقان', 'مرفقات', 'مرفقًا');

/* App mode — the demo-fill shortcut exists only outside production. Set with ?env=… or the side-panel switch. */
const ENVS = { development: 'DEV', testing: 'TEST', production: 'PROD' };
let ENV = (() => { const q = new URLSearchParams(location.search).get('env'); return q in ENVS ? q : 'development'; })();
const isDev = () => ENV !== 'production';

const TODAY = '2026-11-02';
const NOW0 = new Date('2026-11-02T11:07:00'), LOADED = Date.now();
const now = () => new Date(NOW0.getTime() + (Date.now() - LOADED));
function rel(d) {
  const mins = (now() - d) / 60000, days = Math.round((parse(TODAY) - parse(iso(d))) / 864e5);
  if (days === 0) {
    if (mins < 1) return 'الآن';
    if (mins < 60) return 'منذ ' + countAr(Math.round(mins), '', 'دقيقة', 'دقيقتين', 'دقائق', 'دقيقة');
    return 'منذ ' + countAr(Math.round(mins / 60), '', 'ساعة', 'ساعتين', 'ساعات', 'ساعة');
  }
  if (days === 1) return 'أمس';
  if (days < 7) return 'منذ ' + countAr(days, '', 'يوم', 'يومين', 'أيام', 'يومًا');
  if (days < 14) return 'منذ أسبوع';
  if (days < 21) return 'منذ أسبوعين';
  return `${d.getDate()} ${MONTHS[d.getMonth()]}`;
}
function rng(seed) { return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* Topographic contours */
function contourPath(cx, cy, r, seed, amp, pts = 56) {
  const P = [];
  for (let i = 0; i < pts; i++) {
    const t = i / pts * Math.PI * 2;
    const k = 1 + amp * (0.55 * Math.sin(3 * t + seed) + 0.3 * Math.sin(5 * t + seed * 1.7) + 0.4 * Math.sin(2 * t - seed * 0.6));
    P.push([cx + Math.cos(t) * r * k, cy + Math.sin(t) * r * k * 0.82]);
  }
  const f = v => v.toFixed(1);
  let d = `M${f(P[0][0])},${f(P[0][1])}`;
  for (let i = 0; i < pts; i++) {
    const p0 = P[(i - 1 + pts) % pts], p1 = P[i], p2 = P[(i + 1) % pts], p3 = P[(i + 2) % pts];
    d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)},${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)},${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])},${f(p2[1])}`;
  }
  return d + 'Z';
}
function decorate(root = document) {
  root.querySelectorAll('.thumb:not(.has-img):not([data-art])').forEach(t => {
    const i = +(t.dataset.seed || Math.floor(Math.random() * 999));
    t.dataset.art = '';
    t.insertAdjacentHTML('afterbegin', `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g data-contours='{"cx":${30 + (i * 37) % 50},"cy":${25 + (i * 23) % 55},"n":9,"r0":5,"gap":9,"amp":0.2,"seed":${(i * 1.37 % 7).toFixed(2)},"dx":1,"dy":0.6}'></g></svg>`);
  });
  root.querySelectorAll('[data-contours]:empty').forEach(g => {
    const o = JSON.parse(g.dataset.contours);
    let html = '';
    for (let k = 0; k < o.n; k++) {
      const amp = o.amp * (0.3 + 0.7 * k / o.n);
      html += `<path class="${k % 4 === 3 ? 'idx' : ''}" d="${contourPath(o.cx + k * (o.dx || 0), o.cy + k * (o.dy || 0), o.r0 + k * o.gap, o.seed + k * 0.22, amp)}"/>`;
    }
    g.innerHTML = html;
  });
}

// Activity log (BRD): per assigned project, view-only, no export; internal admin operations (users, roles) are excluded.
function activityOf(p) {
  const ev = [];
  const add = (at, kind, title, body = '', who = 'noura', extra = {}) => ev.push({ at: new Date(at), kind, title, body, who, ...extra });
  const made = addDays(p.start, -14);
  add(`${made}T09:00`, 'project', 'تم إنشاء المشروع', `${p.cls} · من ${fmtDate(p.start)} إلى ${fmtDate((p.ext || [])[0]?.from || p.end)}`);
  [...p.pms, ...p.team].forEach((id, k) => add(`${made}T09:${String(10 + k * 3).padStart(2, '0')}`, 'team', `إسناد ${USERS[id].name} إلى المشروع`, USERS[id].role));
  if (p.start <= TODAY) add(`${p.start}T00:00`, 'status', 'بدأ المشروع', 'تغيّرت الحالة تلقائيًا إلى «جارٍ التنفيذ»', 'system', { icon: ['solar:play-circle-bold', 'var(--success)'] });
  (p.ext || []).forEach(x => add(x.at, 'dates', 'تمديد تاريخ النهاية', `من ${fmtDate(x.from)} إلى ${fmtDate(x.to)}`));
  (p.holds || []).forEach(h => {
    add(h.at, 'status', 'تعليق المشروع مؤقتًا', `السبب: ${h.reason}`, 'noura', { icon: ['solar:pause-circle-bold', 'var(--warning)'] });
    if (h.resumedAt) add(h.resumedAt, 'status', 'استئناف المشروع', 'أُعيد احتساب الحالة من التواريخ: «جارٍ التنفيذ»', 'noura', { icon: ['solar:play-circle-bold', 'var(--success)'] });
  });
  if (TODAY > p.end && !holdOf(p)) add(`${addDays(p.end, 1)}T00:00`, 'status', 'انتهت مدة المشروع', 'تغيّرت الحالة تلقائيًا إلى «انتهت المدة» دون تمديد', 'system', { icon: ['solar:flag-bold', 'var(--muted)'] });
  S.direct.filter(f => f.p === p.code).forEach(f => add(`${f.date}T10:00`, 'file', 'رفع ملف إلى مكتبة المشروع', S.atts[f.a].name, f.who));
  updatesOf(p.code).forEach(u => add(u.at, 'update', 'تحديث يومي جديد', u.text, u.author, { u: u.id }));
  return ev.sort((a, b) => b.at - a.at);
}

const view = $('#view'), phone = $('#phone');
const cur = () => S.stack[S.stack.length - 1];
function go(name, params = {}) {
  const sc = view.querySelector('.screen');
  if (sc) cur().scroll = sc.scrollTop;
  S.stack.push({ name, params });
  render('fwd');
}
function back() {
  if (S.stack.length > 1) { S.stack.pop(); render('back'); }
}
function tab(name) { S.stack = [{ name, params: {} }]; render('fade'); }
function render(dir = 'none') {
  closeOverlay();
  const e = cur();
  const old = view.querySelector('.screen');
  if (dir === 'stay' && old) e.scroll = old.scrollTop;
  const r = SCREENS[e.name](e.params);
  const cls = { fwd: 'fwd', back: 'bk', fade: 'fade' }[dir] || '';
  view.innerHTML = `<div class="screen ${cls}">${r.sb === false ? '' : '<div class="sb-bg"></div>'}${r.html}</div>`;
  const tb = $('#tabbar');
  tb.hidden = r.tab == null;
  if (r.tab != null) tb.innerHTML = TABS.map(([k, icon, label], i) =>
    `<button class="tab${i === r.tab ? ' active' : ''}" type="button" data-tab="${k}"${i === r.tab ? ' aria-current="page"' : ''}><iconify-icon icon="${icon}"></iconify-icon><span>${label}</span></button>`).join('');
  decorate(view);
  const sc = view.querySelector('.screen');
  if ((dir === 'back' || dir === 'stay') && e.scroll) sc.scrollTop = e.scroll;
  r.after && r.after();
  syncSide();
}

SCREENS.splash = () => ({ sb: false, tab: null, html: DOIntro.splash(INTRO.role), after() {
  $('#statusbar').classList.add('light');
  clearTimeout(splashT);
  splashT = setTimeout(() => { if (cur().name === 'splash') leaveSplash(); }, DOIntro.SPLASH_MS);
} });
SCREENS.onboarding = ({ i = 0 }) => ({ sb: false, tab: null, html: DOIntro.onboarding({ ...INTRO, i: +i }),
  after() { $('#statusbar').classList.add('light'); } });   // dark "Dusk" screen
// Every launch: splash → 3 onboarding screens → login → home.
function leaveSplash() {
  clearTimeout(splashT);
  // Let the splash dissolve first; skip the hand-over if the user already jumped elsewhere.
  DOIntro.leave(view, () => { if (cur().name !== 'splash') return; S.stack = [{ name: 'onboarding', params: { i: 0 } }]; render('fade'); });
}
function obTo(i) {
  const at = +(cur().params.i || 0);
  if (i === at || i < 0) return;
  if (i >= INTRO.steps.length) return finishIntro();
  cur().params.i = i;
  render(i > at ? 'fwd' : 'back');
}
function finishIntro() { S.stack = [{ name: 'login', params: {} }]; render('fade'); }


// Home status chips keep their sideways position across re-renders, and the selected chip stays in view.
let chipX = 0;
function keepChipInView() {
  const row = view.querySelector('.chips'), on = row && row.querySelector('[aria-pressed="true"]');
  if (!row) return;
  row.scrollLeft = chipX;
  const r = row.getBoundingClientRect(), c = on.getBoundingClientRect(), pad = 24;
  if (c.left < r.left + pad) row.scrollLeft -= r.left + pad - c.left;
  else if (c.right > r.right - pad) row.scrollLeft += c.right - (r.right - pad);
}

const AK = { project: ['solar:folder-with-files-bold', 'var(--indigo)'], team: ['solar:user-plus-bold', 'var(--blue)'], status: ['solar:refresh-circle-bold', 'var(--warning)'],
  dates: ['solar:calendar-date-bold', 'var(--indigo)'], file: ['solar:upload-minimalistic-bold', 'var(--success)'], update: ['solar:document-text-bold', 'var(--primary)'] };
const ACT_GROUPS = { update: ['update'], status: ['status', 'dates', 'project'], team: ['team'], file: ['file'] };
SCREENS.activity = params => {
  const p = P(params.p), all = activityOf(p), k = params.f || 'all', limit = params.limit || 20;
  const inG = (e, g) => g === 'all' || ACT_GROUPS[g].includes(e.kind);
  const list = all.filter(e => inG(e, k));
  const opts = [['all', 'الكل'], ['update', 'التحديثات'], ['status', 'الحالة والتواريخ'], ['team', 'الفريق'], ['file', 'الملفات']];
  let h = '', day = '';
  list.slice(0, limit).forEach((e, i) => {
    const d = iso(e.at);
    if (d !== day) { if (day) h += '</div>'; day = d; h += `<div class="day-head${i ? '' : ' first'}"><span>${d === TODAY ? 'اليوم · ' : d === addDays(TODAY, -1) ? 'أمس · ' : ''}${fmtDate(d)}</span></div><div>`; }
    const [icon, tint] = e.icon || AK[e.kind];
    const inner = `<span class="halo">${ICON(icon, tint)}</span><span class="tl-body"><strong>${e.title}</strong>${e.body ? `<p>${esc(e.body)}</p>` : ''}<span class="tl-meta">${actorName(e.who)}<span class="dot"></span>${fmtTime(e.at)}</span></span>`;
    h += e.u ? `<button class="tl-item" type="button" data-go="update" data-u="${e.u}">${inner}</button>` : `<div class="tl-item">${inner}</div>`;
  });
  if (day) h += '</div>';
  return { html: `<div class="body">
    ${topbar('سجل النشاط', projK(p))}
    <div class="seg" role="group" aria-label="تصفية السجل">${opts.map(([key, l]) => `<button type="button" data-act="actFilter" data-f="${key}" aria-pressed="${key === k}">${l}<span class="c">${all.filter(e => inG(e, key)).length}</span></button>`).join('')}</div>
    ${list.length ? h : emptyBox('solar:history-bold', 'لا توجد أحداث من هذا النوع', 'جرّب نوعًا آخر أو عرض الكل.')}
    ${list.length > limit ? `<button class="more-btn" type="button" data-act="more">${ICON('solar:alt-arrow-down-linear')}عرض المزيد (${list.length - limit})</button>` : ''}
    <div class="msg msg-info" style="margin-top:16px">${ICON('solar:lock-keyhole-minimalistic-bold')}<span>يعرض السجل عمليات هذا المشروع فقط، دون العمليات الإدارية الداخلية مثل المستخدمين والأدوار. للعرض فقط ولا يمكن تصديره.</span></div>
  </div>` };
};

const PERIODS = [['7', 'آخر 7 أيام'], ['30', 'آخر 30 يومًا'], ['all', 'منذ البداية']];
SCREENS.reports = () => {
  const projects = myProjects();
  const head = tabHead('التقارير', 'لمشاريعك المسندة فقط');
  if (!projects.length) return { tab: 2, html: `<div class="body with-tabs">${head}${emptyBox('solar:chart-2-bold', NO_PROJECTS, 'ستظهر هنا تقارير مشاريعك فور إسنادها إليك.')}</div>` };
  const r = S.rep;
  if (r.p !== 'ALL' && !projects.some(p => p.code === r.p)) r.p = 'ALL';
  const sel = r.p === 'ALL' ? projects : [P(r.p)];
  const from = r.period === 'all' ? sel.map(p => p.start).sort()[0] : addDays(TODAY, 1 - +r.period);
  // Reports exclude hidden updates (allVisibleUpdates never returns them).
  const ups = allVisibleUpdates().filter(u => sel.some(p => p.code === u.p) && u.date >= from && u.date <= TODAY);
  const attsN = ups.reduce((n, u) => n + u.atts.length, 0);
  const people = new Set(ups.map(u => u.author)).size;
  const st = Object.keys(STATUS).map(k => [k, sel.filter(p => computeStatus(p) === k).length]);
  const classes = [...new Set(sel.map(p => p.cls))].map(c => [c, sel.filter(p => p.cls === c).length]);

  // Updates over the period: per project, or per day / week for a single project.
  let buckets, bTitle, bSub;
  if (r.p === 'ALL') { buckets = sel.map(p => [p.short, ups.filter(u => u.p === p.code).length]); bTitle = 'التحديثات لكل مشروع'; bSub = 'عدد التحديثات اليومية خلال الفترة'; }
  else if (r.period === '7') { buckets = Array.from({ length: 7 }, (_, i) => addDays(TODAY, -i)).map(d => [fmtDay(d).split(' ').slice(0, 2).join(' '), ups.filter(u => u.date === d).length]); bTitle = 'التحديثات حسب اليوم'; bSub = 'أحدث الأيام أولًا'; }
  else {
    buckets = [];
    for (let end = TODAY; end >= from && buckets.length < 10; end = addDays(end, -7)) {
      const start = addDays(end, -6);
      buckets.push([`أسبوع ${parse(start).getDate()} ${MONTHS[parse(start).getMonth()]}`, ups.filter(u => u.date >= start && u.date <= end).length]);
    }
    bTitle = 'التحديثات حسب الأسبوع'; bSub = 'أحدث الأسابيع أولًا';
  }
  const bMax = Math.max(1, ...buckets.map(b => b[1]));

  // Days without updates: working days (Sun–Thu) while the project was running and not suspended.
  const gaps = sel.map(p => {
    let work = 0, empty = 0;
    const end = [p.end, TODAY].sort()[0];
    for (let d = [p.start, from].sort()[1]; d <= end; d = addDays(d, 1)) {
      const wd = parse(d).getDay();
      if (wd === 5 || wd === 6 || inHold(p, d)) continue;
      work++;
      if (!ups.some(u => u.p === p.code && u.date === d)) empty++;
    }
    return { p, work, empty };
  }).filter(g => g.work);

  // Employee activity: counts only — never a performance score (BRD).
  const emps = [...new Set(sel.flatMap(p => p.team))].map(id => {
    const mine = ups.filter(u => u.author === id);
    return { id, n: mine.length, a: mine.reduce((k, u) => k + u.atts.length, 0), last: mine[0] };
  }).sort((a, b) => b.n - a.n);
  const pLabel = PERIODS.find(x => x[0] === r.period)[1];
  const unitU = n => n === 1 ? 'تحديث يومي' : n === 2 ? 'تحديثان يوميان' : n >= 3 && n <= 10 ? 'تحديثات يومية' : n === 0 ? 'تحديثات يومية' : 'تحديثًا يوميًا';

  return { tab: 2, html: `<div class="body with-tabs">
    ${head}
    <div class="seg fill" role="group" aria-label="الفترة">${PERIODS.map(([k, l]) => `<button type="button" data-act="repPeriod" data-f="${k}" aria-pressed="${k === r.period}">${l}</button>`).join('')}</div>
    <div class="seg" role="group" aria-label="المشروع"><button type="button" data-act="repProject" data-f="ALL" aria-pressed="${r.p === 'ALL'}">كل المشاريع</button>${projects.map(p => `<button type="button" data-act="repProject" data-f="${p.code}" aria-pressed="${r.p === p.code}">${p.short}</button>`).join('')}</div>
    <section class="hero" aria-label="ملخص الفترة">
      ${heroArt(236, 1.4)}
      <div class="hero-top"><span class="hero-label">${ICON('solar:chart-2-bold')}${r.p === 'ALL' ? 'كل المشاريع' : P(r.p).name}</span><span class="badge-pill">${pLabel}</span></div>
      <div class="hero-num"><span class="num" dir="ltr">${ups.length}</span><span class="unit">${unitU(ups.length)}</span></div>
      <div class="hero-actions"><span class="badge-pill">${ICON('solar:paperclip-bold')}${nAtts(attsN)}</span><span class="badge-pill">${ICON('solar:users-group-rounded-bold')}${countAr(people, 'لا مشاركين', 'مشارك واحد', 'مشاركان', 'مشاركين', 'مشاركًا')}</span></div>
    </section>
    <div class="rsec"><h4>المشاريع حسب الحالة</h4><div class="sec-sub">${countAr(sel.length, 'لا مشاريع', 'مشروع واحد', 'مشروعان', 'مشاريع', 'مشروعًا')} · الحالة الحالية</div>
      <div class="sbar" role="img" aria-label="${st.map(([k, n]) => `${STATUS[k].label}: ${n}`).join('، ')}">${st.filter(x => x[1]).map(([k, n]) => `<i style="flex:${n};background:${STATUS[k].color}"></i>`).join('')}</div>
      <div class="slegend">${st.map(([k, n]) => `<span><i style="background:${STATUS[k].color}"></i>${STATUS[k].label}<b>${n}</b></span>`).join('')}</div>
      <div class="cls-row">${classes.map(([c, n]) => `<span class="tag2" style="background:#fff">${c} · <span class="latin">${n}</span></span>`).join('')}</div></div>
    <div class="rsec"><h4>${bTitle}</h4><div class="sec-sub">${bSub}</div>
      ${buckets.map(([l, v]) => `<div class="hrow"><span class="l">${l}</span><span class="tr"><b style="width:${v / bMax * 100}%"></b></span><span class="v">${v}</span></div>`).join('')}</div>
    <div class="rsec"><h4>أيام بلا تحديثات</h4><div class="sec-sub">أيام العمل (الأحد–الخميس) أثناء سير المشروع، دون فترات التعليق</div>
      ${gaps.length ? gaps.map(g => `<div class="hrow"><span class="l">${g.p.short}</span><span class="tr"><b class="warn" style="width:${g.empty / g.work * 100}%"></b></span><span class="v">${g.empty}/${g.work}</span></div>`).join('')
        : `<p class="sec-sub" style="margin:0">لا توجد أيام عمل ضمن هذه الفترة.</p>`}</div>
    <div class="rsec"><h4>نشاط الموظفين</h4><div class="sec-sub">أعداد فقط، وليست تقييمًا للأداء</div>
      ${emps.length ? emps.map(e => `<div class="erow"><span class="avatar sm" aria-hidden="true">${USERS[e.id].i}</span><span class="grow"><strong>${USERS[e.id].name}</strong><span>${USERS[e.id].role}${e.last ? ` · آخر تحديث ${rel(e.last.at)}` : ''}</span></span>
        <span class="ecount"><b>${e.n}</b><span>تحديث</span></span><span class="ecount"><b>${e.a}</b><span>مرفق</span></span></div>`).join('')
        : `<p class="sec-sub" style="margin:0">لا يوجد موظفون في هذه المشاريع.</p>`}</div>
    <div class="msg msg-info" style="margin-top:16px">${ICON('solar:info-circle-bold')}<span>تشمل التقارير المشاريع المسندة إليك فقط، وتستثني التحديثات التي أخفتها الإدارة.</span></div>
  </div>` };
};

SCREENS.map = () => {
  const projects = myProjects().filter(p => !S.mapHide.includes(computeStatus(p)));
  if (!projects.some(p => p.code === S.mapSel) && projects.length) S.mapSel = projects[0].code;
  const sel = projects.find(p => p.code === S.mapSel);
  const pins = projects.map(p => {
    const on = p === sel;
    return `<button class="pin${on ? ' sel' : ''}" type="button" data-act="mapPin" data-p="${p.code}" style="left:${p.x}%;top:${p.y}%" aria-label="${p.name}"><i style="background:${STATUS[computeStatus(p)].color}"></i></button>${on ? `<span class="pin-label" style="left:${p.x}%;top:${p.y}%">${p.name}</span>` : ''}`;
  }).join('');
  const sheet = sel ? (() => { const s = computeStatus(sel); return `<div class="grab"></div>
    <div class="card-head">${pthumb(sel)}
      <div class="card-title"><h3>${sel.name}</h3><div class="card-meta"><span class="code">${sel.code}</span><span class="dot"></span><span>${sel.cls}</span></div></div>${pip(s)}</div>
    <div class="facts" style="margin-top:12px"><span>${ICON('solar:map-point-bold')}${sel.loc}</span></div>
    <div class="btn-row"><a class="btn-primary sm" href="${mapsUrl(sel)}" target="_blank" rel="noopener">${ICON('solar:routing-2-bold')}الاتجاهات</a>
      <button class="btn-sec" type="button" data-go="project" data-p="${sel.code}">عرض تفاصيل المشروع</button></div>`; })()
    : `<div class="grab"></div><div class="empty" style="padding:20px">${myProjects().length ? '<strong>لا توجد مشاريع بالحالات المحددة</strong><p>فعّل حالة واحدة على الأقل لعرض مواقعها.</p>' : `<strong>${NO_PROJECTS}</strong><p>ستظهر مواقع مشاريعك هنا فور إسنادها.</p>`}</div>`;
  return { sb: false, tab: 1, html: `<div class="map">
      <svg viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <path class="sea" d="M-20 300 C 30 360, 40 470, 70 560 S 120 760, 160 880 L -20 880 Z"/>
        <path class="road" d="M80 520 C 150 470, 220 430, 300 400 S 380 380, 420 380"/><path class="road" d="M120 160 C 170 260, 220 320, 290 390"/><path class="road" d="M290 390 C 300 470, 320 560, 360 660"/>
        <g class="contours" data-contours='{"cx":120,"cy":200,"n":9,"r0":14,"gap":18,"amp":0.18,"seed":1.7,"dx":1.5,"dy":1}'></g>
        <g class="contours" data-contours='{"cx":300,"cy":420,"n":11,"r0":12,"gap":17,"amp":0.16,"seed":0.6,"dx":-1.2,"dy":1.4}'></g>
        <g class="contours" data-contours='{"cx":250,"cy":680,"n":8,"r0":16,"gap":18,"amp":0.18,"seed":2.4,"dx":1,"dy":-1}'></g>
      </svg>${pins}</div>
    <div class="map-top">
      <div class="glass map-title"><div><strong>مواقع المشاريع</strong> <span class="muted" style="font-size:12px;font-weight:700"> · ${projects.length} من ${myProjects().length}</span></div>
        <button class="icon-btn" type="button" data-act="mapAll" aria-label="عرض كل الحالات">${ICON('solar:map-bold')}</button></div>
      <div class="glass map-legend" role="group" aria-label="تصفية حسب الحالة">${['IN_PROGRESS', 'ON_HOLD', 'ENDED', 'NOT_STARTED'].map(k =>
        `<button type="button" class="pip ${STATUS[k].cls}${S.mapHide.includes(k) ? ' off' : ''}" data-act="mapFilter" data-s="${k}" aria-pressed="${!S.mapHide.includes(k)}">${STATUS[k].label}</button>`).join('')}</div>
    </div>
    <div class="sheet">${sheet}</div>` };
};

const CAL_MIN = [2026, 3], CAL_MAX = [2026, 11];
SCREENS.calendar = () => {
  const { y, m } = S.cal, first = new Date(y, m - 1, 1), daysIn = new Date(y, m, 0).getDate();
  const ups = allVisibleUpdates();
  const cnt = d => ups.filter(u => u.date === d).length;
  let cells = '<span class="d blank"></span>'.repeat(first.getDay());
  for (let d = 1; d <= daysIn; d++) {
    const ds = iso(new Date(y, m - 1, d)), c = cnt(ds), wd = new Date(y, m - 1, d).getDay();
    const future = ds > TODAY;
    const cls = ['d', future ? 'future' : c >= 3 ? 'l3' : c === 2 ? 'l2' : c === 1 ? 'l1' : (wd === 5 || wd === 6) ? 'rest' : '', ds === TODAY ? 'today' : '', d === S.cal.d ? 'sel' : ''].join(' ');
    cells += `<button type="button" class="${cls}" data-act="calDay" data-d="${d}"${future ? ' disabled' : ''} aria-label="${d} ${MONTHS[m - 1]}، ${nUpdates(c)}">${d}</button>`;
  }
  const selIso = iso(new Date(y, m - 1, S.cal.d)), dayUps = ups.filter(u => u.date === selIso);
  const atMin = y === CAL_MIN[0] && m === CAL_MIN[1], atMax = y === CAL_MAX[0] && m === CAL_MAX[1];
  const item = u => `<button class="panel" type="button" data-go="update" data-u="${u.id}" style="padding:16px 18px;width:100%;text-align:start"><span class="mini">
      <span class="avatar sm" aria-hidden="true">${USERS[u.author].i}</span>
      <span class="mini-body"><span class="mini-top"><strong>${authorName(u.author)}</strong><span>${fmtTime(u.at)}</span></span>
      <p style="white-space:normal;color:#000;font-size:14px;line-height:22px;margin-top:4px">${esc(u.text)}</p>
      <span class="cnt" style="margin-top:6px">${P(u.p).name}${u.atts.length ? ` · ${ICON('solar:paperclip-bold')}${u.atts.length}` : ''}</span></span></span></button>`;
  return { tab: 3, html: `<div class="body with-tabs">
    ${tabHead('التقويم', 'التحديثات اليومية لمشاريعك', `<button class="chip-btn pearl" type="button" data-act="calToday" style="color:#000">${ICON('solar:calendar-mark-bold')}اليوم</button>`)}
    <div class="cal-head"><h3 class="h-md">${MONTHS[m - 1]} <span class="latin">${y}</span></h3>
      <div class="cal-nav"><button class="icon-btn sm" type="button" data-act="calPrev" aria-label="الشهر السابق"${atMin ? ' disabled' : ''}>${ICON('solar:alt-arrow-right-linear')}</button>
        <button class="icon-btn sm" type="button" data-act="calNext" aria-label="الشهر التالي"${atMax ? ' disabled' : ''}>${ICON('solar:alt-arrow-left-linear')}</button></div></div>
    <div class="wk" aria-hidden="true"><span>أحد</span><span>إثنين</span><span>ثلاثاء</span><span>أربعاء</span><span>خميس</span><span>جمعة</span><span>سبت</span></div>
    <div class="cal">${cells}</div>
    <div class="cal-legend"><span>أقل</span><i></i><i style="background:rgba(243,127,70,.2)"></i><i style="background:rgba(243,127,70,.4)"></i><i style="background:var(--primary)"></i><span>أكثر</span></div>
    <div class="sec-head" style="margin-top:26px"><div><h3 class="h-md">${selIso === TODAY ? 'اليوم · ' : ''}${fmtDay(selIso)}</h3><div class="sec-sub">${nUpdates(dayUps.length)}</div></div></div>
    <div class="stack">${dayUps.length ? dayUps.map(item).join('') : emptyBox('solar:calendar-bold', 'لا توجد تحديثات في هذا اليوم', 'اختر يومًا ملوّنًا لعرض تحديثاته.')}</div>
  </div>` };
};

const NT = { update: ['solar:document-add-bold', 'var(--primary)'], status: ['solar:refresh-circle-bold', 'var(--blue)'], suspended: ['solar:pause-circle-bold', 'var(--warning)'], resumed: ['solar:play-circle-bold', 'var(--success)'],
  approaching: ['solar:hourglass-bold', 'var(--warning)'], ended: ['solar:flag-bold', 'var(--muted)'] };
SCREENS.notifications = () => {
  const grp = n => { const d = Math.round((parse(TODAY) - parse(iso(n.at))) / 864e5); return d === 0 ? 'اليوم' : d === 1 ? 'أمس' : 'سابقًا'; };
  const notes = [...S.notes].sort((a, b) => b.at - a.at);
  let h = '', g = '';
  notes.forEach((n, i) => {
    if (grp(n) !== g) { g = grp(n); h += `<div class="ngroup${i ? '' : ' first'}">${g}</div>`; }
    // Deep link only while the user still has access to that project.
    const ok = n.p && visibleCodes().includes(n.p);
    const [icon, tint] = NT[n.type];
    const foot = ok ? `<span class="ntime">${rel(n.at)}</span>${ICON('solar:alt-arrow-left-linear')}`
      : `<span class="ntime">${rel(n.at)}</span><span class="nolink">${ICON('solar:lock-keyhole-minimalistic-bold')}لم يعد لديك صلاحية الوصول</span>`;
    h += `<button type="button" class="nrow${n.unread ? ' unread' : ''}" data-act="openNote" data-n="${n.id}">
      <span class="halo">${ICON(icon, tint)}</span>
      <span class="nbody"><strong>${n.title}</strong><span class="nt">${esc(n.body)}</span><span class="nfoot">${foot}</span></span>
      ${n.unread ? '<span class="ndot" aria-label="غير مقروء"></span>' : ''}</button>`;
  });
  const u = unread();
  return { html: `<div class="body">
    ${topbar('الإشعارات', u ? `${u} غير مقروءة` : 'لا توجد إشعارات غير مقروءة')}
    ${u ? `<div style="display:flex;justify-content:flex-end;margin:-6px 0 4px"><button class="text-btn" type="button" data-act="markAll" style="font-size:12px">تحديد الكل كمقروء</button></div>` : ''}
    ${notes.length ? h : emptyBox('solar:bell-bold', 'لا توجد إشعارات', 'ستصلك هنا إشعارات التحديثات اليومية وتغيّر حالة المشاريع واقتراب تواريخ النهاية.')}
  </div>` };
};

SCREENS.profile = () => ({ tab: 4, html: `<div class="body with-tabs">
  <div class="prof"><div class="avatar xl" aria-hidden="true">${USERS.me.i}</div><h2>${USERS.me.name}</h2><div class="sub">${USERS.me.role}</div>
    <div class="chips"><span class="tag2">مدير مشروع</span><span class="tag2">الصلاحية: عرض فقط</span></div></div>

      <span class="kv"><span>البريد الإلكتروني</span><strong>${esc(S.email)}</strong></span><span class="act">تغيير${ICON('solar:alt-arrow-left-linear')}</span></button>
    <div class="grow-row"><span class="halo">${ICON('solar:phone-bold', 'var(--success)')}</span><span class="kv"><span>رقم الجوال</span><strong class="latin" dir="ltr">+966 50 771 4402</strong></span></div>
    <div class="grow-row"><span class="halo">${ICON('solar:user-id-bold', 'var(--indigo)')}</span><span class="kv"><span>المسمى الوظيفي</span><strong>${USERS.me.role}</strong></span></div>
    <div class="grow-row"><span class="halo">${ICON('solar:folder-with-files-bold', 'var(--primary)')}</span><span class="kv"><span>المشاريع المسندة</span><strong>${countAr(myProjects().length, 'لا توجد مشاريع', 'مشروع واحد', 'مشروعان', 'مشاريع', 'مشروعًا')}</strong></span></div>
  </div>
  <div class="group-label">الأمان</div>
  <div class="gcard">
    <button class="grow-row" type="button" data-go="password"><span class="halo">${ICON('solar:lock-password-bold', 'var(--warning)')}</span><span class="kv"><strong>تغيير كلمة المرور</strong></span>${ICON('solar:alt-arrow-left-linear')}</button>
    <button class="grow-row" type="button" data-act="logout"><span class="halo">${ICON('solar:logout-2-bold', 'var(--error)')}</span><span class="kv"><strong class="danger">تسجيل الخروج</strong></span></button>
  </div>
  <p class="foot-note">حساب مدير المشروع للعرض فقط · لتعديل الاسم أو الجوال تواصل مع مسؤول النظام · <span class="latin">v1.0</span></p>
</div>` });

const pwField = (id, label, icon, ac) => `<div class="field"><label for="${id}">${label}</label>
  <div class="input" id="${id}Box">${ICON(icon)}<input id="${id}" type="password" dir="ltr" placeholder="••••••••" autocomplete="${ac}"><button type="button" class="eye" data-act="eye" aria-label="إظهار كلمة المرور">${ICON('solar:eye-bold')}</button></div></div>`;
SCREENS.password = () => ({ html: `<form class="body" data-submit="password" novalidate>
  ${topbar('تغيير كلمة المرور')}

  <div class="field"><label for="em1">البريد الجديد</label>
